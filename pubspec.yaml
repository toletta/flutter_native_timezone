name: flutter_native_timezone_updated_gradle
description: A flutter plugin for getting the local timezone of the device.
version: 2.0.4
homepage: https://github.com/yamamz/flutter_native_timezone
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter


# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        package: com.whelksoft.flutter_native_timezone
        pluginClass: FlutterNativeTimezonePlugin
      ios:
        pluginClass: FlutterNativeTimezonePlugin
      macos:
        pluginClass: FlutterNativeTimezonePlugin
      web:
        pluginClass: FlutterNativeTimezonePlugin
        fileName: flutter_native_timezone_web.dart
